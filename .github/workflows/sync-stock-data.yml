name: Sync A-Share Historical Data

on:
  schedule:
    # 北京时间每个工作日 16:10（UTC 08:10）收盘后自动更新日线数据
    - cron: '10 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest A-share K-lines
        run: node scripts/fetch-stocks.mjs

      - name: Commit updated data files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): sync A-share daily klines"
            git push
          fi
